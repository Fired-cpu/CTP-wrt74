name: Build System from .config

on: 
  workflow_dispatch:

jobs:
  build:
    # I use 24.04 as this version use gcc15 and also i like it (for compiling).
    runs-on: ubuntu-24.04
    steps:
      # Remove scraps from AWS emulated run
      - name: Optimize space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install and update essentials with dependencies
        continue-on-error: true
        run: |
          sudo apt update
          sudo apt install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Fetch data from SweetR74
        run: |
          git clone --single-branch -b sweetr74 https://github.com/Fired-cpu/CTP-wrt74
          cd CTP-wrt74
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Executing compile process
        run: |
          cd CTP-wrt74
          make download
          make -j$(nproc)
      - name: Organize, Zip and Prepare Firmware Files
        run: |
          mkdir -p firmware_bin/
          # Finds all compiled image files and copies them to our staging directory
          find CTP-wrt74/bin/targets/ -type f \( -name "*.bin" -o -name "*.trx" \) -exec cp {} firmware_bin/ \;
          
          # Create a compressed zip file of the folder
          zip -r openwrt-firmware.zip firmware_bin/
          
          # Set a unique release tag based on the current date and time
          echo "RELEASE_TAG=OpenWrt-Build-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Upload Firmware Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "OpenWrt Compiled Firmware (${{ env.RELEASE_TAG }})"
          body: "Automated custom OpenWrt build generated via GitHub Actions."
          draft: false
          prerelease: false
          # Upload only the compressed .zip archive instead of individual files
          files: openwrt-firmware.zip

