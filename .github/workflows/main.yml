name: Build System from .config

on: 
  workflow_dispatch:

jobs:
  build:
    # I use 24.04 as this version use gcc15 and also i like it (for compiling).
    runs-on: ubuntu-24.04
    steps:
      # Remove scraps from AWS emulated run
      - name: Optimize space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install and update essentials with dependencies
        continue-on-error: true
        run: |
          sudo apt update
          sudo apt install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Fetch data from SweetR74
        run: |
          git clone --single-branch -b sweetr74 https://github.com/Fired-cpu/CTP-wrt74
          cd CTP-wrt74
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Executing compile process   # clean residues of previous attempts, which result in only 1 file was compressed.
        run: |
          cd CTP-wrt74
          make clean
          make download
          make -j$(nproc)
      - name: Organize, Zip and Prepare Firmware Files  # Scan and copy any .bin or .trx from bin/target to the created folder, which is then zipped for download.
        run: |
          mkdir -p firmware_bin/
          # Finds all compiled image files and copies them to our staging directory
          find CTP-wrt74/bin/targets/ -type f \( -name "*.bin" -o -name "*.trx" \) -exec cp {} firmware_bin/ \;
          
          # Create a compressed zip file of the folder
          zip -r openwrt-firmware.zip firmware_bin/
          
          # Set a unique release tag based on the current date and time
          echo "RELEASE_TAG=OpenWrt-Build-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Provide Direct Download Link (Artifact)  # Provide links for taking the generated artifacts.
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-compiled-firmware
          path: openwrt-firmware.zip
          retention-days: 7  # The file will automatically delete itself after 7 days to save space
 
